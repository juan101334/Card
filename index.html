<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <img src="assets/img/tienes14.jpg" alt="" class="card__image">

        <div class="card__content">
            <h2 class="card__content__title">Aprendiz ADSO</h2>
            <p class="card__content__description">Los aprendices ADSO estan al dia con 5</p>
        </div>

        <div class="card__actions">
            <button class="card__button card__button--primary">Aceptar</button>
            <button class="card__button card__button--secondary">Cancelar</button>
        </div>
    </div>
</body>
</html>
